<svg viewBox="0 0 760 242" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke-width:1.8; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">IoT 数据管道架构</text>

  <!-- 传感器 -->
  <rect class="box" x="10" y="88" width="76" height="72" stroke="var(--y)"/>
  <text class="lbl" x="48" y="121" text-anchor="middle" fill="var(--y)">传感器</text>
  <text class="sub" x="48" y="138" text-anchor="middle">设备端</text>

  <line class="arr" x1="86" y1="124" x2="126" y2="124" stroke="var(--muted)"/>
  <text class="sub" x="107" y="116" text-anchor="middle">MQTT</text>

  <!-- EMQX -->
  <rect class="box" x="128" y="88" width="90" height="72" stroke="var(--g)"/>
  <text class="lbl" x="173" y="121" text-anchor="middle" fill="var(--g)">EMQX</text>
  <text class="sub" x="173" y="138" text-anchor="middle">Broker</text>

  <line class="arr" x1="218" y1="124" x2="244" y2="124" stroke="var(--muted)"/>

  <!-- Kafka -->
  <rect class="box" x="246" y="88" width="90" height="72" stroke="var(--b)"/>
  <text class="lbl" x="291" y="121" text-anchor="middle" fill="var(--b)">Kafka</text>
  <text class="sub" x="291" y="138" text-anchor="middle">缓冲削峰</text>

  <line class="arr" x1="336" y1="124" x2="362" y2="124" stroke="var(--muted)"/>

  <!-- Flink -->
  <rect class="box" x="364" y="88" width="90" height="72" stroke="var(--p)"/>
  <text class="lbl" x="409" y="121" text-anchor="middle" fill="var(--p)">Flink</text>
  <text class="sub" x="409" y="138" text-anchor="middle">流处理</text>

  <!-- Flink → TDengine (diagonal up) -->
  <line class="arr" x1="454" y1="116" x2="506" y2="76" stroke="var(--muted)"/>
  <!-- Flink → 告警 (diagonal down) -->
  <line class="arr" x1="454" y1="136" x2="506" y2="176" stroke="var(--muted)"/>

  <!-- TDengine / InfluxDB -->
  <rect class="box" x="512" y="52" width="120" height="60" stroke="var(--b)"/>
  <text class="lbl" x="572" y="73" text-anchor="middle" fill="var(--b)">TDengine</text>
  <text class="sub" x="572" y="90" text-anchor="middle">/ InfluxDB 时序存储</text>

  <!-- 告警服务 -->
  <rect class="box" x="512" y="144" width="120" height="72" stroke="var(--r)"/>
  <text class="lbl" x="572" y="177" text-anchor="middle" fill="var(--r)">告警服务</text>
  <text class="sub" x="572" y="194" text-anchor="middle">钉钉 / 短信 / 邮件</text>

  <!-- TSDB → Grafana -->
  <line class="arr" x1="632" y1="76" x2="654" y2="118" stroke="var(--muted)"/>

  <!-- Grafana -->
  <rect class="box" x="660" y="88" width="90" height="72" stroke="var(--g)"/>
  <text class="lbl" x="705" y="121" text-anchor="middle" fill="var(--g)">Grafana</text>
  <text class="sub" x="705" y="138" text-anchor="middle">可视化看板</text>
</svg>
