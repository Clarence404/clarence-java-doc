<svg viewBox="0 0 680 328" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:2; fill:none; marker-end:url(#a); }
    .note { rx:4; ry:4; fill:var(--card); stroke-width:1; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">undo log / redo log 与两阶段提交</text>

  <!-- Layers -->
  <!-- Application -->
  <rect class="box" x="20" y="45" width="120" height="60" stroke="var(--muted)"/>
  <text x="80" y="58" text-anchor="middle" fill="var(--fg)" font-weight="600" font-size="11">应用层</text>
  <text x="80" y="73" text-anchor="middle" fill="var(--muted)" font-size="10">BEGIN / DML / COMMIT</text>

  <!-- Arrow to InnoDB -->
  <line class="arr" x1="140" y1="75" x2="173" y2="75" stroke="var(--muted)"/>

  <!-- InnoDB Engine -->
  <rect class="box" x="175" y="35" width="230" height="84" stroke="var(--b)"/>
  <text x="290" y="52" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="12">InnoDB 存储引擎</text>
  <text x="290" y="67" text-anchor="middle" fill="var(--fg)" font-size="11">① 写 undo log（支持回滚）</text>
  <text x="290" y="105" text-anchor="middle" fill="var(--fg)" font-size="11">② 修改 Buffer Pool（内存数据页）</text>

  <!-- Step markers -->
  <!-- Two phase commit flow -->
  <text x="340" y="143" text-anchor="middle" font-weight="700" font-size="13" fill="var(--y)">—— 两阶段提交（保证 redo log 与 binlog 一致）——</text>

  <!-- Phase 1 -->
  <rect class="box" x="50" y="158" width="160" height="60" stroke="var(--b)"/>
  <text x="130" y="174" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">① redo log（prepare）</text>
  <text x="130" y="190" text-anchor="middle" fill="var(--fg)" font-size="10">顺序写磁盘，WAL 保证持久</text>

  <line class="arr" x1="210" y1="188" x2="258" y2="188" stroke="var(--muted)"/>

  <!-- binlog -->
  <rect class="box" x="260" y="158" width="160" height="60" stroke="var(--y)"/>
  <text x="340" y="174" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="11">② 写 binlog</text>
  <text x="340" y="190" text-anchor="middle" fill="var(--fg)" font-size="10">Server 层日志，用于复制/恢复</text>

  <line class="arr" x1="420" y1="188" x2="468" y2="188" stroke="var(--muted)"/>

  <!-- Phase 2 -->
  <rect class="box" x="470" y="158" width="160" height="60" stroke="var(--g)"/>
  <text x="550" y="174" text-anchor="middle" fill="var(--g)" font-weight="600" font-size="11">③ redo log（commit）</text>
  <text x="550" y="190" text-anchor="middle" fill="var(--fg)" font-size="10">标记提交完成</text>

  <!-- Crash Recovery Rules -->
  <rect class="note" x="50" y="243" width="580" height="64" stroke="var(--border)"/>
  <text x="340" y="260" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12">崩溃恢复规则</text>
  <text x="340" y="276" text-anchor="middle" fill="var(--g)" font-size="11">redo(prepare) + binlog 完整 → 重新提交 ✅</text>
  <text x="340" y="291" text-anchor="middle" fill="var(--r)" font-size="11">redo(prepare) + binlog 不完整 → 回滚 ✅</text>

  <!-- undo log note -->
  <rect class="note" x="410" y="35" width="240" height="84" stroke="var(--p)"/>
  <text x="530" y="52" text-anchor="middle" fill="var(--p)" font-weight="700" font-size="12">undo log</text>
  <text x="530" y="67" text-anchor="middle" fill="var(--fg)" font-size="11">逻辑逆操作（INSERT→DELETE）</text>
  <text x="530" y="105" text-anchor="middle" fill="var(--fg)" font-size="11">支持 ROLLBACK + MVCC 版本链</text>
</svg>
