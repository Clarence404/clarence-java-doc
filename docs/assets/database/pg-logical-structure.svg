<svg viewBox="0 0 580 279" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .line { stroke-width:1.5; fill:none; }
  </style>

  <text x="290" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">PostgreSQL 逻辑结构</text>

  <!-- Instance -->
  <rect class="box" x="200" y="34" width="180" height="33" stroke="var(--b)"/>
  <text x="290" y="55" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="13">PostgreSQL 实例</text>

  <line class="line" x1="290" y1="67" x2="290" y2="85" stroke="var(--border)"/>

  <!-- Database -->
  <rect class="box" x="190" y="85" width="200" height="32" stroke="var(--p)"/>
  <text x="290" y="105" text-anchor="middle" fill="var(--p)" font-weight="600">数据库（Database）</text>

  <line class="line" x1="290" y1="117" x2="290" y2="135" stroke="var(--border)"/>

  <!-- Schema -->
  <rect class="box" x="200" y="135" width="180" height="32" stroke="var(--g)"/>
  <text x="290" y="155" text-anchor="middle" fill="var(--g)" font-weight="600">模式（Schema）</text>

  <!-- Fan out to leaf nodes -->
  <line class="line" x1="290" y1="167" x2="290" y2="183" stroke="var(--border)"/>
  <line class="line" x1="72" y1="183" x2="504" y2="183" stroke="var(--border)"/>
  <line class="line" x1="72"  y1="183" x2="72"  y2="199" stroke="var(--border)"/>
  <line class="line" x1="180" y1="183" x2="180" y2="199" stroke="var(--border)"/>
  <line class="line" x1="288" y1="183" x2="288" y2="199" stroke="var(--border)"/>
  <line class="line" x1="396" y1="183" x2="396" y2="199" stroke="var(--border)"/>
  <line class="line" x1="504" y1="183" x2="504" y2="199" stroke="var(--border)"/>

  <!-- Table -->
  <rect class="box" x="22"  y="199" width="100" height="32" stroke="var(--y)"/>
  <text x="72"  y="219" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="11">表（Table）</text>

  <!-- View -->
  <rect class="box" x="130" y="199" width="100" height="32" stroke="var(--muted)"/>
  <text x="180" y="219" text-anchor="middle" fill="var(--muted)" font-weight="600" font-size="11">视图（View）</text>

  <!-- Function -->
  <rect class="box" x="238" y="199" width="100" height="32" stroke="var(--muted)"/>
  <text x="288" y="219" text-anchor="middle" fill="var(--muted)" font-weight="600" font-size="11">函数（Function）</text>

  <!-- Sequence -->
  <rect class="box" x="346" y="199" width="100" height="32" stroke="var(--muted)"/>
  <text x="396" y="219" text-anchor="middle" fill="var(--muted)" font-weight="600" font-size="11">序列（Sequence）</text>

  <!-- Index -->
  <rect class="box" x="454" y="199" width="100" height="32" stroke="var(--muted)"/>
  <text x="504" y="219" text-anchor="middle" fill="var(--muted)" font-weight="600" font-size="11">索引（Index）</text>

  <!-- Annotations -->
  <rect x="22" y="243" width="532" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="290" y="256" text-anchor="middle" fill="var(--muted)" font-size="10">默认 Schema = public；多 Schema 实现多租户隔离 / 模块化管理 / 权限隔离</text>
</svg>
